<template>

    <lightning-card title="Account Search and Filter" icon-name="standard:account">

        <div class="slds-p-around_medium">
          <div class="slds-grid slds-gutters">

            <!-- Account Name -->
            <div class="slds-col">
            <lightning-input
                type="search"
                label="Account Name"
                placeholder="Enter Account Name"
                value={searchKey}
                onchange={handleSearchChange}>
                
            </lightning-input>
            </div>

            <!-- Rating -->
            <div class="slds-col">
            <lightning-combobox
                label="Rating"
                value={SelectedRating}
                placeholder="Select Rating"
                options={Ratingoptions}
                onchange={handleRatingChange}>
                
            </lightning-combobox>
            </div>
             </div>

            <!-- Buttons -->
            <div class="slds-m-top_medium">

                <lightning-button
                    label="Search"
                    variant="brand"
                    onclick={handleSearch}>
                </lightning-button>

                <lightning-button
                    label="Clear"
                    variant="neutral"
                    onclick={handleClear}
                    class="slds-m-left_small">
                </lightning-button>

            </div>

            <!-- Account Results -->
            <template lwc:if={accounts}>

                <div class="slds-m-top_medium">

                    <lightning-datatable
                        key-field="Id"
                        data={accounts}
                        columns={columns}
                        hide-checkbox-column>
                    </lightning-datatable>

                </div>

            </template>

        </div>

        <template lwc:if={noRecords}>
        <div class="slds-p-around_medium slds-text-align_center">
            No Records Found
        </div>
        </template>

    </lightning-card>

</template>
