<template>
<template for:each={accountList} for:item="acc">
    <lightning-card key={acc.Id} variant="Narrow"  title={acc.Name} icon-name="standard:account">
        <lightning-button-icon  icon-name="utility:edit" variant="border-filled" alternative-text="Show More" slot="actions"></lightning-button-icon>
        <lightning-button  icon-name="utility:view" variant="border-filled" label="view" slot="actions"> </lightning-button>
        <lightning-button  icon-name="utility:edit" variant="border-filled" label="view Terms and Conditions" onclick={handleModalPopup} slot="actions"> </lightning-button>
        Name: {acc.Name}
        Phone: {acc.Phone}
          <template if:true={showModal}>  <!--if it is true then Modal template display -->
            <lightning-modal-header label="My Modal Heading"></lightning-modal-header>
                <lightning-modal-body>
                    {content}
                </lightning-modal-body>
                <lightning-modal-footer>
                    <!-- Footer here --> 
            </lightning-modal-footer>
        </template>
    </lightning-card>
  
</template>
</template>
